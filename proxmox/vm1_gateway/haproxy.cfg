global
    log stdout format raw local0 info
    maxconn 10000

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    option  redispatch
    http-reuse always
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout queue   30s
    timeout http-keep-alive 10s

# Micro-caché en memoria RAM para optimización de alto tráfico
cache cache_nodosur
    total-max-size 20
    max-object-size 1048576
    max-age 15

# Panel de Monitoreo en Vivo (http://<IP_WAN>:8404/stats o http://10.33.199.105:8404/stats)
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 2s
    stats auth admin:tas13pass

# Entrada Principal Segura (VM 105 - Gateway WAN)
frontend https_nodosur
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/nodosur.pem
    maxconn 8000
    
    # Redirección obligatoria a HTTPS
    http-request redirect scheme https unless { ssl_fc }
    
    # Tabla de mitigación de saturación / rate limit
    stick-table type ip size 100k expire 30s store http_req_rate(10s),conn_cur
    http-request track-sc0 src
    
    # Compresión gzip
    compression algo gzip
    compression type text/html text/plain text/css application/javascript
    
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Port %[dst_port]
    
    # Cabeceras de seguridad
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff
    
    default_backend cluster_wordpress

# Backend: Clúster de Nodos Web (VM 106 y VM 107 en LAN privada)
backend cluster_wordpress
    balance leastconn
    
    # Cache para páginas públicas estáticas excluyendo login y wp-admin
    http-request cache-use cache_nodosur unless { path_beg /wp-admin } || { path_beg /wp-login.php } || { method POST }
    http-response cache-store cache_nodosur
    
    # Health check de nivel L7
    option httpchk
    http-check send meth HEAD uri / ver HTTP/1.1 hdr Host localhost
    http-check expect rstatus (2|3)[0-9][0-9]
    
    # Persistencia de sesión por cookie
    cookie SRVID insert indirect nocache
    
    http-response set-header X-Nodo-Backend %s
    http-response set-header X-Estado-Cache HIT if !{ srv_id -m found }
    http-response set-header X-Estado-Cache MISS if { srv_id -m found }
    
    # Nodos Web en la red interna LAN
    server vm-web1 10.33.199.106:80 check cookie web1 maxconn 100 inter 3s fall 3 rise 2
    server vm-web2 10.33.199.107:80 check cookie web2 maxconn 100 inter 3s fall 3 rise 2
