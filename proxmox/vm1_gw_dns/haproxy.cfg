global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    nbthread 2
    maxconn 10000
    tune.bufsize 262144

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    option  redispatch
    http-reuse always
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout queue   30s
    timeout http-keep-alive 10s

# Micro-cache en RAM ampliada a 64 MB
cache cache_nodosur
    total-max-size 64
    max-object-size 200000
    max-age 30

# Panel de Monitoreo Visual en puerto 8404
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 2s
    stats auth admin:tas13pass
    stats admin if TRUE

# Entrada Principal Segura (Gateway 10.33.195.195 / 10.33.199.109)
frontend https_nodosur
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/nodosur.pem alpn h2,http/1.1
    maxconn 8000
    
    stats enable
    stats uri /stats
    stats refresh 2s
    stats auth admin:tas13pass
    stats admin if TRUE

    http-request redirect scheme https code 301 unless { ssl_fc }
    
    # Tabla de mitigacion DoS y fuerza bruta
    stick-table type ip size 100k expire 30s store http_req_rate(10s),conn_cur
    http-request track-sc0 src
    
    # Bloqueo de vector xmlrpc.php y rate-limit activo en login
    http-request deny deny_status 403 if { path_beg /xmlrpc.php }
    http-request deny deny_status 429 if { path_beg /wp-login.php } { method POST } { sc_http_req_rate(0) gt 15 }
    
    compression algo gzip
    compression type text/html text/plain text/css application/javascript
    
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Port %[dst_port]
    
    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-response del-header X-Powered-By
    http-response del-header Server
    
    # Enrutamiento L7 por Hostname / Subdominio y Rutas
    acl is_zabbix       hdr(host) -i zabbix.nodosur.cl zabbix.tas13.local
    acl is_grafana      hdr(host) -i grafana.nodosur.cl grafana.tas13.local
    acl is_zabbix_path  path_beg /zabbix
    acl is_grafana_path path_beg /grafana

    use_backend backend_zabbix  if is_zabbix || is_zabbix_path
    use_backend backend_grafana if is_grafana || is_grafana_path
    default_backend cluster_wordpress

# Cluster de Nodos Backend (Web 1: .106 y Web 2: .107)
backend cluster_wordpress
    balance leastconn
    
    acl es_ruta_dinamica path_beg /wp-admin /wp-login.php /stats
    acl pide_no_cache req.hdr(Cache-Control) -m sub no-cache
    acl tiene_sesion_wp req.hdr(Cookie) -m sub wordpress_logged_in
    
    http-request set-var(txn.cacheable) int(1) if !es_ruta_dinamica !pide_no_cache !tiene_sesion_wp { method GET HEAD }
    
    # Usar micro-cache en RAM salvo en rutas dinamicas o cuando se pide no-cache
    http-request cache-use cache_nodosur if { var(txn.cacheable) -m int eq 1 }
    
    option httpchk
    http-check send meth HEAD uri / ver HTTP/1.1 hdr Host localhost
    http-check expect rstatus (2|3)[0-9][0-9]
    
    http-response set-header X-Nodo-Backend %s if { srv_id -m found }
    http-response set-header X-Nodo-Backend "haproxy-ram-cache" if !{ srv_id -m found }
    http-response set-header X-Estado-Cache HIT if !{ srv_id -m found }
    http-response set-header X-Estado-Cache MISS if { srv_id -m found }
    
    # Permitir que HAProxy almacene en RAM las paginas publicas GET
    http-response del-header Set-Cookie if { var(txn.cacheable) -m int eq 1 }
    http-response del-header Pragma if { var(txn.cacheable) -m int eq 1 }
    http-response del-header Expires if { var(txn.cacheable) -m int eq 1 }
    http-response set-header Cache-Control "public, max-age=30, s-maxage=30" if { var(txn.cacheable) -m int eq 1 }
    http-response cache-store cache_nodosur if { var(txn.cacheable) -m int eq 1 }
    
    server vm206-web1 10.33.199.106:80 check maxconn 150 inter 3s fall 3 rise 2
    server vm248-web2 10.33.199.107:80 check maxconn 150 inter 3s fall 3 rise 2

# Backend: Observabilidad Zabbix Web UI (VM 110 en LAN privada)
backend backend_zabbix
    mode http
    balance roundrobin
    option httpchk GET /zabbix/
    http-check expect rstatus (2|3)[0-9][0-9]
    server vm-zabbix 10.33.199.110:80 check inter 4s fall 3 rise 2

# Backend: Dashboards Grafana (VM 110 en LAN privada)
backend backend_grafana
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server vm-grafana 10.33.199.110:3000 check inter 4s fall 3 rise 2

# Acceso Directo a Grafana en puerto 3000
frontend grafana_direct
    bind *:3000
    mode http
    default_backend backend_grafana
