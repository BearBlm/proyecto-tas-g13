# /etc/netplan/01-netcfg.yaml en VM 110 (Servidor de Backup y Storage Seguro)
network:
  version: 2
  renderer: networkd
  ethernets:
    # Conectada a vmbr1 (LAN Interna Aislada)
    eth0:
      dhcp4: false
      addresses:
        - 10.33.199.110/29
      routes:
        - to: default
          via: 10.33.199.105  # Gateway VM 105
      nameservers:
        addresses:
          - 10.33.199.109    # DNS BIND9 VM 109
          - 8.8.8.8
