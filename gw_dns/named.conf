options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion yes;
    forwarders { 8.8.8.8; 1.1.1.1; };
    dnssec-validation no;
};

zone "tas13.local" {
    type master;
    file "/etc/bind/db.tas13.local";
};

zone "nodosur.cl" {
    type master;
    file "/etc/bind/db.nodosur.cl";
};